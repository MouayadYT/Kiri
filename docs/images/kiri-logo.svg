<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 33 190 190" width="256" height="256">
  <defs>
    <!-- Ring Gradient -->
    <linearGradient id="ring-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#143852"/>
      <stop offset="24%" stop-color="#0B4672"/>
      <stop offset="52%" stop-color="#0774AC"/>
      <stop offset="78%" stop-color="#38BAEB"/>
      <stop offset="100%" stop-color="#73EAFF"/>
    </linearGradient>
    <!-- Wave Gradient using the darkish blue palette -->
    <linearGradient id="wave-grad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#143852"/>
      <stop offset="28%" stop-color="#0C395A"/>
      <stop offset="58%" stop-color="#0B4672"/>
      <stop offset="84%" stop-color="#0774AC"/>
      <stop offset="100%" stop-color="#0582C5"/>
    </linearGradient>
    <!-- Arm Gradient for lower K branch using the darkish blue palette -->
    <linearGradient id="arm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C395A"/>
      <stop offset="45%" stop-color="#0B4672"/>
      <stop offset="100%" stop-color="#0774AC"/>
    </linearGradient>
    <!-- Inner Pool Gradient with darkish blue palette and adjusted opacity for richness -->
    <linearGradient id="pool-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B4672" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0C395A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#143852" stop-opacity="0.75"/>
    </linearGradient>
    <!-- 3D Glass Bevel and Shadow for Icon Elements -->
    <filter id="icon-soft" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Drop Shadow -->
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#143852" flood-opacity="0.35"/>
      <!-- Bottom-Right Shadow Bevel -->
      <feOffset dx="2" dy="2" in="SourceAlpha" result="off2"/>
      <feComposite operator="out" in="SourceAlpha" in2="off2" result="diff2"/>
      <feFlood flood-color="#143852" flood-opacity="0.55" result="col2"/>
      <feComposite operator="in" in="col2" in2="diff2" result="sh1"/>
      <!-- Soft Inner Volume Light -->
      <feGaussianBlur stdDeviation="6" in="SourceAlpha" result="blur1"/>
      <feOffset dx="-2" dy="-2" in="blur1" result="off3"/>
      <feComposite operator="in" in="off3" in2="SourceAlpha" result="diff3"/>
      <feFlood flood-color="#B4E8FE" flood-opacity="0.3" result="col3"/>
      <feComposite operator="in" in="col3" in2="diff3" result="volHi"/>
      <!-- Merge Layers -->
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="volHi"/>
        
      </feMerge>
    </filter>
    <!-- Ring Clip Path for internal elements -->
    <clipPath id="ring-clip">
      <circle cx="128" cy="128" r="64"/>
    </clipPath>

    <!-- Reapply the existing bevel only outside the three marked cleanup areas. -->
    <filter id="bevel-only" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="2" in="SourceAlpha" result="off2"/>
      <feComposite operator="out" in="SourceAlpha" in2="off2" result="diff2"/>
      <feFlood flood-color="#143852" flood-opacity="0.55" result="col2"/>
      <feComposite operator="in" in="col2" in2="diff2" result="sh1"/>
    </filter>
    <filter id="soften-mask" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soften-mask-small" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
    <mask id="bevel-except-marked" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" style="mask-type:luminance">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <!-- No bevel on the left join, lower-left join or right wave tip. -->
      <ellipse cx="68" cy="125" rx="18" ry="28" fill="black" filter="url(#soften-mask)"/>
      <ellipse cx="66" cy="173" rx="16" ry="22" fill="black" filter="url(#soften-mask)"/>
      <ellipse cx="214" cy="114" rx="10.5" ry="11" fill="black" filter="url(#soften-mask-small)"/>
      <!-- No bevel line on the upper edge near the lower arm tip. -->
      <ellipse cx="209.5" cy="165" rx="9" ry="8" fill="black" filter="url(#soften-mask-small)"/>
    </mask>
    <!-- Fill the tiny gap where the ring's inner shadow band stops short of the lower arm. -->
    <clipPath id="band-gap-clip">
      <polygon points="176.3,168.5 178.35,170.35 180.25,168.05 178.2,166.2"/>
    </clipPath>
    <mask id="not-arm" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" style="mask-type:luminance">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <path d="M 166,145 C 178,155 192,168 206,176" fill="none" stroke="black" stroke-width="22" stroke-linecap="round"/>
    </mask>
    <!-- Let the wave's shadow band taper off instead of ending in a square cut where it meets the ring. -->
    <linearGradient id="taper-fade" gradientUnits="userSpaceOnUse" x1="192" y1="0" x2="203" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="taper-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" style="mask-type:luminance">
      <rect x="0" y="0" width="256" height="256" fill="black"/>
      <rect x="150" y="90" width="70" height="70" fill="url(#taper-fade)"/>
      <!-- keep clear of the existing shadow band (inside the shifted pool circle) -->
      <circle cx="130" cy="130" r="63" fill="black"/>
    </mask>
  </defs>
  <!-- Internal Gloss / Pool inside the ring (now BEHIND the ring + ~ so nothing overlays the wave) -->
  <g clip-path="url(#ring-clip)">
    <!-- Darkish Blue gradient pool at bottom -->
    <rect x="50" y="110" width="156" height="100" fill="url(#pool-grad)"/>
  </g>
  <!-- Main AI Icon Group (Ring + K Strokes) -->
  <g filter="url(#icon-soft)">
    <!-- Outer Ring -->
    <circle cx="128" cy="128" r="72" fill="none" stroke="url(#ring-grad)" stroke-width="18"/>
    <!-- Lower branch of the 'K' (seamlessly splits off the curve junction) -->
    <path d="M 166,145 C 178,155 192,168 206,176" fill="none" stroke="url(#arm-grad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Main Fluid Wave (Acts as the back-stem and upper branch of the 'K') -->
    <path d="M 50,154 C 65,100 115,115 145,135 C 175,155 195,145 210,122" fill="none" stroke="url(#wave-grad)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- Keep original shading everywhere except within the highlighted artifacts. -->
  <g filter="url(#bevel-only)" mask="url(#bevel-except-marked)">
    <!-- Outer Ring -->
    <circle cx="128" cy="128" r="72" fill="none" stroke="url(#ring-grad)" stroke-width="18"/>
    <!-- Lower branch of the 'K' (seamlessly splits off the curve junction) -->
    <path d="M 166,145 C 178,155 192,168 206,176" fill="none" stroke="url(#arm-grad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Main Fluid Wave (Acts as the back-stem and upper branch of the 'K') -->
    <path d="M 50,154 C 65,100 115,115 145,135 C 175,155 195,145 210,122" fill="none" stroke="url(#wave-grad)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- Tapered continuation of the wave's shadow band over the ring (symmetric corner). -->
  <g filter="url(#bevel-only)" mask="url(#taper-mask)">
    <path d="M 50,154 C 65,100 115,115 145,135 C 175,155 195,145 210,122" fill="none" stroke="url(#wave-grad)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- Continue the ring's inner shadow band right up to the arm edge (never over the arm). -->
  <g clip-path="url(#band-gap-clip)" mask="url(#not-arm)">
    <path fill="#40819c" fill-rule="evenodd" d="M 65,128 a 63,63 0 1,0 126,0 a 63,63 0 1,0 -126,0 Z M 67,130 a 63,63 0 1,0 126,0 a 63,63 0 1,0 -126,0 Z"/>
  </g>
</svg>
